apiVersion: apps/v1
kind: Deployment
metadata:
  name: amihan
spec:
  selector:
    matchLabels:
      app: amihan
  replicas: 1
  template:
    metadata:
      labels:
        app: amihan
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4242"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: api
          image: ghcr.io/ekristen/amihan
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - api-server
          ports:
            - containerPort: 4242
              name: http
              protocol: TCP
          env:
            - name: NOMAD_ADDRESS
              value: http://localhost:4646
            - name: DISPATCH_COOLDOWN
              value: 5m
            - name: NOMAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: amihan
                  key: nomad-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
